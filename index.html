<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>QTW 策略績效</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /*
    版面：上方一條產品列，下面是一欄最寬 1200px 的畫布，左右各 24px（手機 16px）。
    卡片間距一律 16px。總績效卡是 2fr + 1fr：左邊圖、右邊開關清單；手機改成上下。
    顏色只放在資料上：總績效線用唯一的藍，各策略依分類用三組色系＋虛線樣式區分，紅賺綠賠只用在數字。
    Apple 設計原則：系統字型（SF Pro / 蘋方）、Apple 系統色（文字用無障礙版本）、分組卡片、可點的東西至少 44px 高。
  */
  :root {
    --ground: #f2f2f7; --surface: #ffffff; --raised: #f7f7fa; --active: #e5e5ea;
    --border: #e5e5ea; --rule: #ededf0; --control: #d1d1d6;
    --text: #000000; --muted: #6e6e73; --faint: #6e6e73;
    --accent: #007aff; --link: #0066cc; --up: #d70015; --down: #248a3d; --grid: #e5e5ea;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --num: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    --gap: 16px; --pad: 20px; --radius: 12px; --radius-control: 8px; --hit: 36px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #000000; --surface: #1c1c1e; --raised: #232325; --active: #2c2c2e;
      --border: #2c2c2e; --rule: #262628; --control: #48484a;
      --text: #ffffff; --muted: #a1a1a6; --faint: #98989d;
      --accent: #0a84ff; --link: #409cff; --up: #ff6961; --down: #30d158; --grid: #2c2c2e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.47; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .n { font-family: var(--num); font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .mute { color: var(--muted); }

  /* 產品列 */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0px); }
  .bar-in { max-width: 1248px; margin-inline: auto; height: 56px; display: flex; align-items: center; gap: 12px; padding-inline: max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px)); }
  .mark { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark svg { flex: none; }
  .mark b { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .mark span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fresh .stale { color: var(--up); font-weight: 500; }
  .fresh { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .btn { height: var(--hit); padding: 0 14px; border-radius: 999px; border: 0; background: var(--active); color: var(--link); cursor: pointer; font-size: 15px; font-weight: 500; }
  .btn:hover { background: var(--control); }
  .btn:active { transform: translateY(1px); }

  /* 畫布 */
  .page { max-width: 1248px; margin-inline: auto; padding: 24px max(24px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: var(--gap); }
  .title { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
  .finding { margin: 0; font-size: 15px; color: var(--text); }
  .finding .n { font-weight: 600; }
  .alert { margin: 0; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .alert b { color: var(--up); font-weight: 600; }
  .link { border: 0; background: none; padding: 0 4px; min-height: var(--hit); color: var(--link); cursor: pointer; font-size: 15px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
  .card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 16px var(--pad) 0; }
  h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); }

  /* 總績效 */
  .perf { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .perf-main { padding: 16px var(--pad) 12px; min-width: 0; }
  .perf-side { border-left: 1px solid var(--border); padding: 16px var(--pad); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .lead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .lead-v { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .lead-s { font-size: 13px; color: var(--muted); }
  .lead-s .n { color: var(--text); font-weight: 500; }
  .chart { position: relative; margin-top: 12px; height: 300px; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .chart-empty { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 13px; color: var(--muted); }
  .tip { position: absolute; z-index: 3; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); padding: 8px 10px; font-size: 12px; min-width: 150px; }
  .tip .d { color: var(--muted); margin-bottom: 4px; }
  .tip .r { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; line-height: 1.7; }
  .tip .r .n { text-align: right; }
  .tip .tot { font-weight: 600; }

  .grp { display: flex; flex-direction: column; gap: 2px; }
  .grp-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 0 8px; min-height: var(--hit); cursor: pointer; text-align: left; font-size: 13px; color: var(--muted); }
  .grp-h:hover { color: var(--text); }
  .grp-h .n { font-size: 13px; }
  .tg { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: var(--hit); padding: 0 8px; border: 0; border-radius: var(--radius-control); background: none; cursor: pointer; text-align: left; font-size: 15px; }
  .tg:hover { background: var(--raised); }
  .tg[aria-pressed="false"] { color: var(--faint); }
  .tg[aria-pressed="false"] svg { opacity: .3; }
  .tg[aria-pressed="false"] .n { color: var(--faint); }
  .tg-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg.total { cursor: default; font-weight: 600; }
  .tg.total:hover { background: none; }
  .idle { font-size: 13px; color: var(--muted); margin: 0; padding: 0 8px; }

  /* 指標列：一個容器用細線分格 */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .kpi { padding: 14px var(--pad); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kpi + .kpi { border-left: 1px solid var(--border); }
  .kpi-l { font-size: 13px; color: var(--muted); }
  .kpi-v { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .kpi-v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .kpi-s { font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--active); color: var(--text); width: max-content; margin-top: 3px; }
  .pill.ok { background: #dcfae5; color: #04250e; }
  .pill.bad { background: #ffedea; color: #831c1e; }
  @media (prefers-color-scheme: dark) { .pill.ok { background: #172a1d; color: #3fc07a; } .pill.bad { background: #2c1a20; color: #ff7a8a; } }

  /* 表格 */
  .tbl-wrap { overflow-x: auto; padding: 4px var(--pad) 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 400; font-size: 13px; color: var(--muted); padding: 10px 8px 8px; white-space: nowrap; border-bottom: 1px solid var(--border); }
  td { text-align: right; padding: 0 8px; height: 48px; border-bottom: 1px solid var(--rule); white-space: nowrap; font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 500; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  td.t { font-family: var(--font); font-weight: 400; }
  td .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; line-height: 1.25; }
  td.two { line-height: 1.3; }
  tr.cat td { height: 40px; background: var(--raised); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 14px; }
  tr.cat td:first-child { font-family: var(--font); padding-left: 10px; }
  tr.cat td:last-child { padding-right: 10px; }
  tbody.pick tr.row { cursor: pointer; }
  tbody.pick tr.row:hover td { background: var(--raised); }
  tr.sel td { background: var(--active) !important; }
  tr.off td { color: var(--faint); }
  .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; background: var(--active); color: var(--muted); vertical-align: 1px; }
  .sw { display: inline-block; vertical-align: middle; margin-right: 8px; }
  td.mob, th.mob { display: none; }
  tr.quiet td { height: auto; padding: 10px 0 12px; white-space: normal; color: var(--muted); font-size: 13px; line-height: 1.9; }
  .q-l { margin-right: 10px; }
  .q-n { display: inline-block; white-space: nowrap; margin-right: 12px; color: var(--faint); }
  .filter { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--active); color: var(--link); cursor: pointer; font-size: 13px; font-weight: 500; }
  .empty-row td { height: 44px; color: var(--muted); font-family: var(--font); font-weight: 400; text-align: left; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
  .foot { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  .skel { display: inline-block; height: .9em; width: 4em; border-radius: 4px; background: var(--active); vertical-align: middle; }

  @media (pointer: coarse) { :root { --hit: 44px; } }
  @media (max-width: 980px) {
    .perf { grid-template-columns: 1fr; }
    .perf-side { border-left: 0; border-top: 1px solid var(--border); }
    .two-col { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi:nth-child(4) { border-left: 0; }
    .kpi:nth-child(n+4) { border-top: 1px solid var(--border); }
    .kpi:nth-child(5) { grid-column: span 2; }
  }
  @media (max-width: 640px) {
    .bar-in { padding-inline: 16px; }
    .mark span { display: none; }
    .page { padding-inline: 16px; padding-top: 16px; }
    :root { --pad: 16px; --hit: 44px; }
    h1 { font-size: 28px; }
    .lead-v { font-size: 34px; }
    .fresh { font-size: 12px; gap: 8px; }
    .fresh .btn { padding: 0 12px; }
    .chart { height: 220px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(n) { border-left: 0; border-top: 0; }
    .kpi:nth-child(even) { border-left: 1px solid var(--border); }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--border); }
    .kpi:last-child { grid-column: 1 / -1; border-left: 0; }
    /* 表格在手機變成兩行的清單：第一行名稱和主要數字，第二行其他欄位 */
    thead { display: none; }
    td.dsk { display: none; }
    td.mob { display: table-cell; }
    td.mob.l { text-align: left; white-space: normal; }
    tr.cat td.dsk-cat { display: none; }
    .tbl-wrap { padding-top: 8px; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="7" width="4" height="9" rx="1" fill="var(--accent)"/><rect x="4.4" y="3" width="1.2" height="16" fill="var(--accent)"/><rect x="9" y="9" width="4" height="7" rx="1" fill="var(--text)"/><rect x="10.4" y="6" width="1.2" height="13" fill="var(--text)"/><rect x="15" y="5" width="4" height="8" rx="1" fill="var(--accent)"/><rect x="16.4" y="2" width="1.2" height="14" fill="var(--accent)"/></svg>
      <b>QTW 策略</b><span id="scope">XQ 實盤</span>
    </div>
    <div class="fresh"><span id="loaded">讀取中…</span><button class="btn" id="reload" type="button">重新整理</button></div>
  </div>
</header>

<main class="page">
  <div class="title">
    <h1>策略績效</h1>
    <p class="finding" id="finding"><span class="skel" style="width:18em"></span></p>
  </div>

  <p class="alert" id="err" hidden><b>讀不到試算表</b><span id="err-msg">請確認「策略管理」的共用設定是「知道連結的任何人 → 檢視者」。</span><button class="link" id="retry" type="button">再試一次</button></p>

  <section class="card perf" aria-labelledby="perf-h">
    <div class="perf-main">
      <h2 id="perf-h">總績效</h2>
      <div class="lead"><span class="lead-v" id="lead-v"><span class="skel" style="width:3.5em;height:28px"></span></span><span class="lead-s" id="lead-s"></span></div>
      <div class="chart" id="chart"><p class="chart-empty" id="chart-empty" hidden></p></div>
    </div>
    <div class="perf-side" id="toggles" aria-label="選擇要疊上的策略"></div>
  </section>

  <section class="card kpis" aria-label="其他指標">
    <div class="kpi"><span class="kpi-l">已實現淨損益</span><span class="kpi-v" id="k-pnl"><span class="skel"></span></span><span class="kpi-s">扣手續費和稅</span></div>
    <div class="kpi"><span class="kpi-l">勝率</span><span class="kpi-v" id="k-win"><span class="skel"></span></span><span class="kpi-s" id="k-wl">&nbsp;</span></div>
    <div class="kpi"><span class="kpi-l">持倉</span><span class="kpi-v" id="k-pos"><span class="skel"></span></span><span class="kpi-s" id="k-pos-s">&nbsp;</span></div>
    <div class="kpi"><span class="kpi-l">未實現損益</span><span class="kpi-v" id="k-unr"><span class="skel"></span></span><span class="kpi-s" id="k-unr-s">&nbsp;</span></div>
    <div class="kpi"><span class="kpi-l">和電腦資料核對</span><span class="pill" id="k-check">—</span></div>
  </section>

  <section class="card" aria-labelledby="st-h">
    <div class="card-h"><h2 id="st-h">各策略</h2><span class="meta">依分類排列，點一列只看那支策略的持倉和交易</span></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>策略</th><th>趟數</th><th>勝率</th><th>累積報酬</th><th>淨損益</th><th>平均每趟</th><th>持倉</th><th>未實現</th><th>最近出場</th></tr></thead>
        <tbody class="pick" id="st-body"></tbody>
      </table>
    </div>
  </section>

  <div class="two-col">
    <section class="card" aria-labelledby="pos-h">
      <div class="card-h"><h2 id="pos-h">目前持倉</h2><span class="meta" id="pos-meta"></span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>股票</th><th>多空</th><th>張數</th><th>均價</th><th>收盤</th><th>未實現</th></tr></thead>
          <tbody id="pos-body"></tbody>
        </table>
      </div>
    </section>
    <section class="card" aria-labelledby="tr-h">
      <div class="card-h"><h2 id="tr-h">最近交易</h2><span class="meta" id="tr-meta"></span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>股票</th><th>出場</th><th>多空</th><th>進場</th><th>出場價</th><th>報酬</th></tr></thead>
          <tbody id="tr-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <p class="foot">累積報酬是每趟報酬直接相加，不是帳戶報酬率。勝負只看價差，不扣手續費。紅色賺、綠色賠。資料來源：Google 試算表「策略管理」，打開時即時讀取，每 5 分鐘自動更新。</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  const SHEET_ID = '1ZF5fgJgwMrs5sfUYWTpfX0HI9zoZlQL9WxcU4QeZL7U';
  const SRC = {
    kpi: { sheet: '總覽', range: 'A4:G5', text: ['與電腦資料核對'] },
    strategies: { sheet: '總覽', range: 'A8:N', text: ['策略', '狀態', '最近出場日', '分類'] },
    trips: { sheet: '_trips', range: 'A1:V', text: ['trip_id', 'exit_date', 'strategy', 'strategy_log', 'code', 'name', 'side', 'entry_date', 'entry_time', 'exit_time', 'trade_type', 'synced_at'] },
    positions: { sheet: '_positions', range: 'A1:L', text: ['date', 'strategy', 'code', 'name', 'side', 'entry_date', 'synced_at'] },
    sync: { sheet: '_sync_log', range: 'A1:H', text: ['同步時間', '資料日期', '方式', '備註'], optional: true },
  };

  // 分類：試算表有「分類」欄就用它，沒有就從策略名稱判斷。順序就是畫面上的排列順序。
  const CATS = ['波段做多', '當沖做空', '隔日沖', '其他'];
  const catOf = (name, given) => {
    if (given && String(given).trim()) return String(given).trim();
    if (/隔日沖/.test(name)) return '隔日沖';
    if (/(^|_)沖空(_|$)/.test(name)) return '當沖做空';
    if (/多$/.test(name)) return '波段做多';
    return '其他';
  };
  // 各分類一組色系，同組裡再用虛線樣式分開；總績效固定用 --accent
  const HUES = {
    light: { '波段做多': ['#30b0c7', '#1c7f91', '#5ac8da', '#0e5f6e'], '當沖做空': ['#ff9500', '#d97a00', '#ffbd59', '#a85f00'], '隔日沖': ['#8e8e93', '#48484a', '#aeaeb2'], '其他': ['#a2845e', '#7d6446'] },
    dark: { '波段做多': ['#40c8e0', '#2aa3b8', '#7fdcec', '#1d8396'], '當沖做空': ['#ff9f0a', '#e08600', '#ffc266', '#b86e00'], '隔日沖': ['#98989d', '#d1d1d6', '#6e6e73'], '其他': ['#ac8e68', '#8c704f'] },
  };
  const DASH = ['', '6 4', '2 3', '10 3 2 3'];
  const dark = window.matchMedia('(prefers-color-scheme: dark)');

  // 簡稱：去掉分類字和停損參數那段；撞名就用全名
  const shortOf = (name) => name.replace(/^沖空_/, '').replace(/_沖空$/, '').replace(/_隔日沖$/, '').split('_').filter((p) => !/損/.test(p)).join('_') || name;

  const url = (s) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(s.sheet)}&range=${s.range}&t=${Date.now()}`;
  const toNum = (s) => {
    if (s == null) return null;
    const t = String(s).trim().replace(/,/g, '').replace(/−/g, '-');
    if (t === '') return null;
    const pct = t.endsWith('%');
    const n = Number(pct ? t.slice(0, -1) : t);

  const load = async (key) => {

  const store = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 私密模式不能存就算了 */ } } };

  // ---- 把資料整理成畫面要的樣子 ----
  const build = () => {
    const rows = D.strategies.filter((r) => r['策略']);
    const names = new Set(rows.map((r) => r['策略']));
    D.trips.forEach((t) => { if (t.strategy && !names.has(t.strategy)) { names.add(t.strategy); rows.push({ '策略': t.strategy, '狀態': '未登錄' }); } });

    });

      const pal = HUES[theme][c] || HUES[theme]['其他'];

  // ---- 標題下的一句話：最近一個出場日的結果，和持倉裡跌最多的一檔 ----

  const renderLead = () => {

  // ---- 右側開關清單 ----

    const css = getComputedStyle(document.documentElement);

    const totalV = [0, ...M.total];

  // ---- 各策略表（依分類分組，每組有小計） ----
  const renderStrategies = () => {
    const tb = $('st-body'); tb.replaceChildren();
    ordered().forEach(({ cat, items }) => {
      const n = d3.sum(items, (s) => s.n), w = d3.sum(items, (s) => s.w), l = d3.sum(items, (s) => s.l);

      td(h, `${cat}（${items.length} 支）`, 'mob l'); td(h, F.pct(ret), 'mob ' + F.tone(ret));
      tb.appendChild(h);
      const quiet = items.filter((s) => !s.n && !s.pos);
      items.filter((s) => s.n || s.pos).forEach((s) => {
        const tr = el('tr', 'row'); tr.tabIndex = 0; tr.dataset.strategy = s.name; tr.title = s.name;
        if (picked === s.name) tr.classList.add('sel');
        if (s.status === '停用' || (!s.n && !s.pos)) tr.classList.add('off');
        const c = td(tr, '', 't dsk');
        c.appendChild(M.series.has(s.name) ? swatch(s.color, s.dash) : blank()); c.appendChild(document.createTextNode(s.short));
        if (s.status && s.status !== '啟用') c.appendChild(el('span', 'tag', s.status));
        td(tr, F.int(s.n), 'dsk');
        two(tr, s.n ? F.rate(s.w / s.n) : '—', s.n ? `${s.w}勝${s.l}負${s.t ? s.t + '平' : ''}` : null, 'dsk');
        td(tr, F.pct(s.ret), 'dsk ' + F.tone(s.ret));
        td(tr, F.money(s.pnl), 'dsk ' + F.tone(s.pnl));
        td(tr, s.n ? F.pct(s.avg) : '—', 'dsk ' + (s.n ? F.tone(s.avg) : ''));
        td(tr, F.int(s.pos), 'dsk');
        td(tr, s.pos ? F.money(s.unr) : '—', 'dsk ' + (s.pos ? F.tone(s.unr) : ''));
        td(tr, s.last ? F.day(s.last) : '—', 'dsk');
        // 手機：兩行
        const mc = el('td', 'mob l t two');
        const top = el('span'); top.appendChild(M.series.has(s.name) ? swatch(s.color, s.dash) : blank()); top.appendChild(document.createTextNode(s.short));
        if (s.status && s.status !== '啟用') top.appendChild(el('span', 'tag', s.status));
        mc.appendChild(top);
        mc.appendChild(el('span', 'sub', s.n || s.pos ? `${s.n} 趟${s.n ? '・' + s.w + '勝' + s.l + '負' : ''}・淨 ${F.money(s.pnl)}${s.pos ? '・持倉 ' + s.pos + '（' + F.money(s.unr) + '）' : ''}` : '還沒有交易'));
        tr.appendChild(mc);
        td(tr, F.pct(s.ret), 'mob ' + F.tone(s.ret));
        tb.appendChild(tr);
      });
      if (quiet.length) {
        const q = el('tr', 'quiet');
        const c = el('td', 't'); c.colSpan = 9;
        c.appendChild(el('span', 'q-l', `還沒有交易（${quiet.length} 支）`));
        quiet.forEach((s) => { const n = el('span', 'q-n', s.short); n.title = s.name; if (s.status && s.status !== '啟用') n.appendChild(el('span', 'tag', s.status)); c.appendChild(n); });
        q.appendChild(c); tb.appendChild(q);
      }
    });
  };
  const blank = () => { const b = el('span', 'sw'); b.style.width = '22px'; return b; };

  const emptyRow = (tb, cols, text) => { const tr = el('tr', 'empty-row'); const c = td(tr, text); c.colSpan = cols; tb.appendChild(tr); };
  const filterChip = (meta, base) => {
    meta.replaceChildren(document.createTextNode(base));
    if (!picked) return;
    const b = el('button', 'filter'); b.type = 'button'; b.textContent = '只看 ' + shortOf(picked) + '  ✕'; b.title = '顯示全部';
    b.addEventListener('click', () => { picked = null; renderFiltered(); });
    meta.replaceChildren(b);
  };

  const renderPositions = () => {
    const tb = $('pos-body'); tb.replaceChildren();
    const rows = M.positions.filter((p) => !picked || p.strategy === picked).sort((a, b) => (a.unrealized_pct ?? 0) - (b.unrealized_pct ?? 0));
    filterChip($('pos-meta'), M.lastPosDate ? F.day(M.lastPosDate) + ' 收盤・' + rows.length + ' 檔' : '');
    if (!rows.length) { emptyRow(tb, 6, picked ? '這支策略目前沒有持倉。' : '目前沒有持倉。'); return; }
    rows.forEach((p) => {
      const tr = el('tr');
      two(tr, p.name || p.code, shortOf(p.strategy || '') + '・' + F.day(p.entry_date) + ' 進場', 't dsk');
      td(tr, p.side === 'short' ? '空' : '多', 't dsk');
      td(tr, F.lots(p.shares), 'dsk');
      td(tr, F.price(p.avg_cost), 'dsk');
      td(tr, F.price(p.close_price), 'dsk');
      two(tr, F.money(p.unrealized_pnl), F.pct(p.unrealized_pct), 'dsk ' + F.tone(p.unrealized_pnl));
      const mc = el('td', 'mob l t two'); mc.appendChild(el('span', null, (p.name || p.code) + '　' + (p.side === 'short' ? '空' : '多') + ' ' + F.lots(p.shares) + ' 張'));
      mc.appendChild(el('span', 'sub', shortOf(p.strategy || '') + '・均價 ' + F.price(p.avg_cost) + '・收盤 ' + F.price(p.close_price))); tr.appendChild(mc);
      two(tr, F.pct(p.unrealized_pct), F.money(p.unrealized_pnl), 'mob ' + F.tone(p.unrealized_pnl));
      tb.appendChild(tr);
    });
  };

  const renderTrips = () => {
    const tb = $('tr-body'); tb.replaceChildren();
    const key = (t) => t.d + ' ' + F.hm(t.exit_time);
    const all = M.trips.filter((t) => !picked || t.strategy === picked).sort((a, b) => (key(a) < key(b) ? 1 : key(a) > key(b) ? -1 : 0));
    const rows = all.slice(0, Math.max(5, Math.min(8, M.positions.length + 2)));
    filterChip($('tr-meta'), all.length > rows.length ? `最近 ${rows.length} 趟，共 ${all.length} 趟` : `共 ${all.length} 趟`);
    if (!rows.length) { emptyRow(tb, 6, picked ? '這支策略還沒有出場紀錄。' : '還沒有出場紀錄。'); return; }
    rows.forEach((t) => {
      const tr = el('tr');
      two(tr, t.name || t.code, shortOf(t.strategy || '') + '・' + (t.trade_type === 'daytrade' ? '當沖' : '波段'), 't dsk');
      two(tr, F.day(t.d), F.hm(t.exit_time), 'dsk');
      td(tr, t.side === 'short' ? '空' : '多', 't dsk');
      td(tr, F.price(t.entry_price), 'dsk');
      td(tr, F.price(t.exit_price), 'dsk');
      two(tr, F.pct(t.return_pct), F.money(t.net_pnl), 'dsk ' + F.tone(t.return_pct));
      const mc = el('td', 'mob l t two'); mc.appendChild(el('span', null, (t.name || t.code) + '　' + (t.side === 'short' ? '空' : '多') + ' ' + F.price(t.entry_price) + ' → ' + F.price(t.exit_price)));
      mc.appendChild(el('span', 'sub', F.day(t.d) + ' ' + F.hm(t.exit_time) + '・' + shortOf(t.strategy || '') + '・' + F.lots(t.shares) + ' 張')); tr.appendChild(mc);
      two(tr, F.pct(t.return_pct), F.money(t.net_pnl), 'mob ' + F.tone(t.return_pct));
      tb.appendChild(tr);
    });
  };

  const renderAll = () => { if (!D) return; build(); renderFinding(); renderLead(); renderKpis(); renderToggles(); renderChart(); renderStrategies(); renderPositions(); renderTrips(); $('scope').textContent = `XQ 實盤・${M.strat.length} 支策略`; };
  const renderFiltered = () => { if (!M) return; renderStrategies(); renderPositions(); renderTrips(); };

  // 手機：手指放開後提示留著，點圖以外的地方才收起來
  let hideTip = () => {};
  document.addEventListener('pointerdown', (ev) => { if (!$('chart').contains(ev.target)) hideTip(); }, { passive: true });

  let busy = false, lastOk = null;
  const refresh = async () => {
    if (busy) return; busy = true;
    $('loaded').textContent = '讀取中…';
    try {
      const keys = Object.keys(SRC);
      const vals = await Promise.all(keys.map((k) => (SRC[k].optional ? load(k).catch(() => []) : load(k))));
      D = Object.fromEntries(keys.map((k, i) => [k, vals[i]]));
      $('err').hidden = true;
      renderAll();
      lastOk = new Date();
      const hhmm = lastOk.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      const pushed = (D.sync || []).map((r) => /(\d{4})\D(\d{1,2})\D(\d{1,2})\D+(\d{1,2}):(\d{2})/.exec(String(r['同步時間'] || ''))).filter(Boolean).pop();
      const lb = $('loaded');
      if (pushed) {
        const when = new Date(+pushed[1], pushed[2] - 1, +pushed[3], +pushed[4], +pushed[5]);
        lb.textContent = '電腦 ' + (+pushed[2]) + '/' + (+pushed[3]) + ' ' + pushed[4].padStart(2, '0') + ':' + pushed[5] + ' 推送';
        // 超過 2 天沒推送（跨週末也夠用）就提醒
        lb.classList.toggle('stale', Date.now() - when.getTime() > 2.5 * 864e5);
        if (lb.classList.contains('stale')) lb.textContent += '・很久沒更新';
      } else { lb.textContent = hhmm + ' 讀取'; lb.classList.remove('stale'); }
      lb.title = '網頁 ' + hhmm + ' 讀取試算表';
    } catch (e) {
      $('err').hidden = false;
      const why = /not shared/.test(e.message) ? '請確認「策略管理」的共用設定是「知道連結的任何人 → 檢視者」。'
        : /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? '網路連不上 Google，等一下再試。'
        : '讀取「' + e.message.split(' ')[0] + '」時出錯（' + e.message + '）。';
      $('err-msg').textContent = lastOk
        ? '這次沒讀到，畫面是 ' + lastOk.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }) + ' 的資料。' : why;
      $('loaded').textContent = lastOk ? '更新失敗' : '沒有讀到資料';
      if (!D) { $('finding').textContent = '等試算表讀到後顯示。'; document.querySelectorAll('.skel').forEach((k) => k.replaceWith(document.createTextNode('—'))); }
    } finally { busy = false; }
  };

  const pick = (tr) => { const s = tr && tr.dataset.strategy; if (!s) return; picked = picked === s ? null : s; renderFiltered(); };
  const st = $('st-body');
  st.addEventListener('click', (ev) => pick(ev.target.closest('tr.row')));
  st.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(ev.target.closest('tr.row')); } });
  $('reload').addEventListener('click', refresh);
  $('retry').addEventListener('click', refresh);
  let rw = 0; window.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => M && renderChart(), 150); });
  dark.addEventListener('change', () => D && renderAll());
  setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D) refresh(); });
  refresh();
})();
</script>
</body>
</html>
